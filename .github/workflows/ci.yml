name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets the release workflow gate publishing on this same matrix.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]

    name: Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the test suite
        run: bundle exec rake spec

      - name: Build the gem
        run: bundle exec rake build
